<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Icon Container -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Frame -->
    <path d="M 40,4 L 72,18 L 72,50 C 72,68 40,78 40,78 C 40,78 8,68 8,50 L 8,18 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Inner Cyber Core -->
    <path d="M 40,14 L 62,24 L 62,48 C 62,60 40,68 40,68 C 40,68 18,60 18,48 L 18,24 Z" 
          fill="#090e1a" stroke="#0ea5e9" stroke-width="1.5" />
    
    <!-- Radar / Sentinel Eye -->
    <circle cx="40" cy="38" r="14" fill="none" stroke="#38bdf8" stroke-dasharray="3 2" stroke-width="1.5" />
    <circle cx="40" cy="38" r="7" fill="url(#pulseGrad)" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="40" cy="38" r="2.5" fill="#ffffff" />

    <!-- Waveform Telemetry Lines -->
    <path d="M 26,48 L 33,48 L 37,42 L 43,54 L 47,48 L 54,48" 
          fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography Brand -->
  <text x="96" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="2">SENTINEL</text>
  <text x="98" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="3.5">FINANCIAL INTELLIGENCE</text>
</svg>
